<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salida registrada</title>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
  background:
    radial-gradient(
      circle at center,
      #ff3b3b 0%,
      #ff6262 18%,
      rgba(255,80,80,0.65) 32%,
      rgba(255,80,80,0) 58%
    ),
    #55c8f5;
}

h1 {
  color: white;
  font-size: 42px;
  text-align: center;
  font-weight: bold;
}

#contador {
  position: fixed;
  top: 20px;
  left: 20px;
  color: white;
  font-size: 32px;
  font-weight: bold;
}
</style>
</head>

<body>

<div id="contador">...</div>
<h1>Salida registrada</h1>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
  getDatabase,
  ref,
  runTransaction
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyD3OL2AenQRwc1zpjQ88z05P1a7XbIXuXY",
  authDomain: "salida-sk-registrada.firebaseapp.com",
  databaseURL: "https://salida-sk-registrada-default-rtdb.firebaseio.com",
  projectId: "salida-sk-registrada",
  storageBucket: "salida-sk-registrada.firebasestorage.app",
  messagingSenderId: "414217724367",
  appId: "1:414217724367:web:edcda278193616587132ba"
};

const app = initializeApp(firebaseConfig);
const database = getDatabase(app);
const contadorRef = ref(database, "contador");

runTransaction(contadorRef, (actual) => {
  return (actual || 0) + 1;
}).then((resultado) => {
  if (resultado.committed) {
    document.getElementById("contador").textContent =
      resultado.snapshot.val();
  }
}).catch((error) => {
  console.error(error);
  document.getElementById("contador").textContent = "—";
});
</script>

</body>
</html>
